[package]
name = "rouille3"
version = "0.1.0"
edition = "2021"
authors = ["Stormwindsky"]
license = "MIT"
description = "Rouille3 - a Rust engine that runs Scratch / TurboWarp projects natively (PC only)"

# Flat layout: main.rs is at the root of the project, not in src/
[[bin]]
name = "rouille3"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
# Enables the .ogg container and every codec for rodio's decoder (feature unification)
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = "0.44"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "2"

[profile.dev]
opt-level = 2
